[package]
name = "strata-telemetry"
version = "0.1.0"
edition.workspace = true

[features]
http = ["dep:http"]
axum = ["dep:axum", "http"]

[dependencies]
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
opentelemetry = { workspace = true, features = ["internal-logs"] }
opentelemetry-otlp = { workspace = true, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, default-features = false, features = ["ansi", "fmt", "smallvec", "std", "env-filter", "local-time", "registry"] }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
