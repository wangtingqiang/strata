[package]
name = "strata"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
argon2 = ["dep:argon2", "dep:thiserror"]
config = ["dep:config", "dep:serde", "dep:thiserror", "text"]
error = ["dep:thiserror"]
hash = ["dep:hex", "dep:sha2"]
pagination = ["dep:strata-error", "dep:serde", "dep:thiserror"]
serde = ["dep:serde", "dep:secrecy"]
task = ["dep:tokio", "dep:tracing", "tokio/rt"]
text = []
time = ["dep:time"]
validation = ["dep:secrecy", "dep:thiserror"]

[dependencies]
strata-error = { path = "../strata-error", optional = true }

argon2 = { workspace = true, optional = true }
config = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
secrecy = { workspace = true, features = ["serde"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
time = { workspace = true, features = ["formatting", "macros", "parsing"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
