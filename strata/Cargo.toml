[package]
name = "strata"
version = "0.1.0"
edition.workspace = true

[features]
config = ["dep:config", "dep:serde", "dep:thiserror"]
error = ["dep:thiserror"]
hash = ["dep:hex", "dep:sha2"]
opaque-token = ["dep:hex", "dep:secrecy", "dep:sha2", "dep:thiserror", "dep:uuid", "uuid/v4"]
pagination = ["dep:const_format", "dep:serde", "dep:thiserror", "error"]
password = ["dep:argon2", "dep:thiserror"]
serde = ["dep:serde", "dep:secrecy"]
task = ["dep:tokio", "dep:tracing", "tokio/rt"]
text = ["dep:thiserror"]
time = ["dep:time"]
validation = ["dep:secrecy", "dep:thiserror"]

[dependencies]
strata-error = { path = "../strata-error" }

argon2 = { version = "0.6.0", optional = true }
config = { version = "0.15", optional = true }
const_format = { version = "0.2", optional = true }
hex = { workspace = true, optional = true }
secrecy = { workspace = true, features = ["serde"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
time = { workspace = true, features = ["formatting", "macros", "parsing"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
