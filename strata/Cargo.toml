[package]
name = "strata"
version = "0.1.0"
edition.workspace = true

[features]
clickhouse = ["dep:clickhouse", "dep:secrecy", "dep:serde", "dep:thiserror"]
config = ["dep:config", "dep:serde", "dep:thiserror"]
error = ["dep:thiserror"]
hash = ["dep:hex", "dep:sha2"]
http = ["dep:axum", "dep:serde", "dep:tracing", "error", "time"]
jwt = ["dep:base64", "dep:ed25519-dalek", "dep:jsonwebtoken", "dep:serde", "dep:serde_json", "dep:thiserror", "jsonwebtoken/rust_crypto"]
macros = ["dep:strata-macros"]
opaque-token = ["dep:hex", "dep:secrecy", "dep:sha2", "dep:thiserror", "dep:uuid", "uuid/v4"]
pagination = ["dep:const_format", "dep:serde", "dep:thiserror", "error"]
password = ["dep:argon2", "dep:secrecy", "dep:thiserror"]
redis = ["dep:redis", "dep:secrecy", "dep:serde", "dep:thiserror"]
s3 = ["dep:hex", "dep:hmac", "dep:secrecy", "dep:serde", "dep:sha2", "dep:thiserror", "dep:url"]
serde = ["dep:serde"]
sqlx-mysql = ["dep:secrecy", "dep:serde", "dep:sqlx", "dep:thiserror", "sqlx/mysql"]
sqlx-postgres = ["dep:secrecy", "dep:serde", "dep:sqlx", "dep:thiserror", "sqlx/postgres"]
task = ["dep:tokio", "dep:tracing", "tokio/rt"]
telemetry = [
    "dep:serde", "dep:thiserror",
    "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk",
    "dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber",
    "opentelemetry-otlp/trace", "opentelemetry-otlp/http-proto", "opentelemetry-otlp/reqwest-blocking-client",
    "opentelemetry/internal-logs", "opentelemetry_sdk/trace",
    "tracing-subscriber/ansi", "tracing-subscriber/fmt", "tracing-subscriber/smallvec", "tracing-subscriber/std",
    "tracing-subscriber/env-filter", "tracing-subscriber/local-time", "tracing-subscriber/registry",
]
telemetry-http = ["dep:axum", "dep:http", "telemetry"]
text = ["dep:thiserror"]
time = ["dep:time"]
validation = ["dep:secrecy", "dep:thiserror"]

[dependencies]
strata-macros = { path = "../strata-macros", optional = true }

argon2 = { version = "0.6.0-rc.8", optional = true }
axum = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
clickhouse = { version = "0.15", optional = true }
config = { version = "0.15", optional = true }
const_format = { version = "0.2", optional = true }
ed25519-dalek = { version = "2", optional = true }
hex = { version = "0.4", optional = true }
hmac = { version = "0.13", optional = true }
http = { version = "1", optional = true }
jsonwebtoken = { version = "10", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
redis = { version = "1.3", optional = true }
secrecy = { version = "0.10", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
sqlx = { version = "0.9", optional = true }
thiserror = { version = "2", optional = true }
time = { version = "0.3", features = ["formatting", "macros", "parsing"], optional = true }
tokio = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false }
uuid = { version = "1", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
trybuild = "1"

[[test]]
name = "compiletest"
required-features = ["macros", "error"]

[[test]]
name = "test_error_info"
required-features = ["macros", "error"]
