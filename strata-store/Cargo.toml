[package]
name = "strata-store"
version = "0.1.0"
edition.workspace = true

[features]
clickhouse = ["dep:clickhouse", "dep:secrecy", "dep:serde", "dep:thiserror"]
redis = ["dep:redis", "dep:secrecy", "dep:serde", "dep:thiserror"]
redis-connection-manager = ["redis", "redis/connection-manager", "redis/tokio-comp"]
sqlx-mysql = ["dep:secrecy", "dep:serde", "dep:sqlx", "dep:thiserror", "sqlx/mysql"]
sqlx-postgres = ["dep:secrecy", "dep:serde", "dep:sqlx", "dep:thiserror", "sqlx/postgres"]

[dependencies]
clickhouse = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
secrecy = { workspace = true, features = ["serde"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
