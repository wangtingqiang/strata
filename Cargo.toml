[workspace]
resolver = "3"
members = [
    "strata",
    "strata-axum",
    "strata-error",
    "strata-error-macros",
    "strata-jwt",
    "strata-store",
    "strata-telemetry",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
argon2 = "0.6"
axum = "0.8"
base64 = "0.22"
clickhouse = "0.15"
config = "0.15"
ed25519-dalek = "2"
hex = "0.4"
http = "1"
http-body-util = "0.1"
jsonwebtoken = "10"
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = "0.32"
proc-macro2 = "1"
quote = "1"
redis = "1"
secrecy = "0.10"
serde = "1"
serde_json = "1"
sha2 = "0.11"
sqlx = "0.9"
syn = "2"
thiserror = "2"
time = "0.3"
tokio = "1"
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
