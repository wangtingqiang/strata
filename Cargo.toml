[workspace]
resolver = "3"
members = [
    "strata",
    "strata-error",
    "strata-error-macros",
    "strata-store",
    "strata-telemetry",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
hex = "0.4"
hmac = "0.13"
secrecy = "0.10"
serde = "1"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = "0.3"
tokio = "1"
tracing = "0.1"
url = "2"
uuid = "1"
